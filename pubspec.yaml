name: krishi_sutra
description: "Offline-first agriculture intelligence platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.42
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  intl: ^0.20.2
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  connectivity_plus: ^7.3.1
  phosphor_flutter: ^2.1.0
  freezed_annotation: any
  json_annotation: any
  flutter_svg: ^2.2.3
  appwrite: ^26.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.5.0
  image: ^4.9.2
  image_picker: ^1.1.2
  tflite_flutter: ^0.12.1
  workmanager: ^0.9.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  vosk_flutter: ^0.3.48
  permission_handler: ^10.4.5

dependency_overrides:
  http: ^1.5.0
  archive: ^4.0.9
  flutter_web_auth_2: 5.1.0
  workmanager_android: 0.9.2
  workmanager_platform_interface: 0.9.3
  permission_handler_android: 13.0.1
  permission_handler_platform_interface: 4.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  freezed: any
  json_serializable: any
  drift_dev: any
  archive: ^4.0.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.jpeg
    - assets/models/crop_disease_v1.tflite
    - assets/models/labels.txt
    - assets/models/vosk/vosk-model-small-hi-0.22.zip
